# CI: build + test on every pull request. The heavier checks (sanitizers, lint, coverage) live in test.yml.
#
# Runs inside ghcr.io/ai-warevo/ci-cpp20: linux/amd64 with gcc-15, clang-18 (libstdc++),
# clang-tidy, clang-format, cmake, ninja, gcovr — fully reproducible, no runner OS dependency.

name: CI

on:
  pull_request:
    branches: [main, master]
  merge_group:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/ai-warevo/ci-cpp20

jobs:
  build-test:
    name: ${{ matrix.toolchain }} / ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    container:
      image: ${{ env.IMAGE }}
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: gcc15
            build_type: [Debug, Release]
          - toolchain: clang18-libstdcxx
            build_type: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify toolchain
        run: |
          echo "=== ${{ matrix.toolchain }} ==="
          if [ "${{ matrix.toolchain }}" = "gcc15" ]; then
            g++ --version | head -1
          else
            clang++-18 --version | head -1
          fi
          cmake --version | head -1
          ninja --version

      - name: Configure & Build
        run: |
          BUILD_DIR="build/${{ matrix.toolchain }}-${{ matrix.build_type }}"
          if [ "${{ matrix.toolchain }}" = "gcc15" ]; then
            cmake -B "$BUILD_DIR" -G Ninja \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
              -DAW_TPL_BUILD_EXAMPLES=ON \
              -DAW_TPL_BUILD_TESTS=ON \
              -DAW_TPL_WARNINGS_AS_ERRORS=ON \
              -DCMAKE_INSTALL_PREFIX=install
            cmake --build "$BUILD_DIR" --parallel
          else
            cmake -B "$BUILD_DIR" -G Ninja \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
              -DCMAKE_CXX_COMPILER=clang++-18 \
              -DCMAKE_CXX_FLAGS="-stdlib=libc++" \
              -DCMAKE_EXE_LINKER_FLAGS="-stdlib=libc++" \
              -DAW_TPL_BUILD_EXAMPLES=ON \
              -DAW_TPL_BUILD_TESTS=ON \
              -DAW_TPL_WARNINGS_AS_ERRORS=ON \
              -DCMAKE_INSTALL_PREFIX=install
            cmake --build "$BUILD_DIR" --parallel
          fi

      - name: Run Tests
        working-directory: build/${{ matrix.toolchain }}-${{ matrix.build_type }}
        run: ctest --output-on-failure --timeout 120

      - name: Run Examples (Unix)
        run: |
          BUILD_DIR="build/${{ matrix.toolchain }}-${{ matrix.build_type }}"
          for example in "$BUILD_DIR"/examples/aw_tpl_example_*; do
            echo "=== $(basename "$example")"
            "$example"
          done

      - name: Install
        run: cmake --install build/${{ matrix.toolchain }}-${{ matrix.build_type }}

      - name: Package Artifacts
        run: tar -czvf aw_tpl-${{ matrix.toolchain }}-${{ matrix.build_type }}.tar.gz -C install .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aw_tpl-${{ matrix.toolchain }}-${{ matrix.build_type }}
          path: aw_tpl-*.tar.gz
          if-no-files-found: ignore

  # Default options (no examples/tests): this is what a consumer gets without enabling anything.
  build-test-default:
    name: default options / ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    container:
      image: ${{ env.IMAGE }}
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        toolchain: [gcc15, clang18-libstdcxx]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify toolchain
        run: |
          if [ "${{ matrix.toolchain }}" = "gcc15" ]; then
            g++ --version | head -1
          else
            clang++-18 --version | head -1
          fi

      - name: Configure & Build
        run: |
          BUILD_DIR="build/${{ matrix.toolchain }}-Release"
          if [ "${{ matrix.toolchain }}" = "gcc15" ]; then
            cmake -B "$BUILD_DIR" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DAW_TPL_WARNINGS_AS_ERRORS=ON
          else
            cmake -B "$BUILD_DIR" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_CXX_COMPILER=clang++-18 \
              -DCMAKE_CXX_FLAGS="-stdlib=libc++" \
              -DAW_TPL_WARNINGS_AS_ERRORS=ON
          fi
          cmake --build "$BUILD_DIR" --parallel

      - name: Run Tests
        working-directory: build/${{ matrix.toolchain }}-Release
        run: ctest --output-on-failure --timeout 120
