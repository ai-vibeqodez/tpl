name: CI & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

# Отменяем старые незавершённые запуски для того же PR / ветки
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows-MSVC
            os: windows-latest
            cc: cl
            cxx: cl
          - name: Linux-GCC
            os: ubuntu-latest
            cc: gcc
            cxx: g++
          - name: Linux-Clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
          - name: macOS-AppleClang
            os: macos-latest
            cc: clang
            cxx: clang++

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure & Build (Unix)
        if: runner.os != 'Windows'
        uses: ai-warevo/.github/ci/actions/cmake-build@main
        with:
          source_dir: .
          build_dir: build
          build_type: Release
          extra_args: -DAW_TPL_BUILD_EXAMPLES=ON -DAW_TPL_BUILD_TESTS=OFF -DCMAKE_INSTALL_PREFIX=install

      - name: Configure & Build (Windows)
        if: runner.os == 'Windows'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DAW_TPL_BUILD_EXAMPLES=ON -DAW_TPL_BUILD_TESTS=OFF -DCMAKE_INSTALL_PREFIX=install
          cmake --build build --config Release --parallel
          cmake --install build --config Release

      - name: Run Examples (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter aw_tpl_example_*.exe | ForEach-Object {
            Write-Host "=== $($_.Name)"
            & $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Run Examples (Unix)
        if: runner.os != 'Windows'
        run: |
          for example in ./build/examples/aw_tpl_example_*; do
            echo "=== $example"
            "$example"
          done

      - name: Package Artifacts (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path install\* -DestinationPath aw_tpl-${{ matrix.name }}.zip

      - name: Package Artifacts (Unix)
        if: runner.os != 'Windows'
        run: tar -czvf aw_tpl-${{ matrix.name }}.tar.gz -C install .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aw_tpl-${{ matrix.name }}
          path: aw_tpl-${{ matrix.name }}.*

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract release notes from CHANGELOG.md
        id: changelog_parser
        uses: ai-warevo/.github/ci/actions/changelog-release@main
        with:
          tag: ${{ github.ref_name }}
          release-body: release_body.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: release_body.md
