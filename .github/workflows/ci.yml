# CI: build + test on every pull request. The heavier checks (sanitizers, lint, coverage) live in test.yml.
#
# Linux jobs run inside ghcr.io/ai-warevo/ci-cpp20 (linux/amd64):
#   gcc-15, clang-18 (libstdc++ + libc++), cmake, ninja, gcovr
# MSVC runs on windows-latest (native runner).

name: CI

on:
  pull_request:
    branches: [main, master]
  merge_group:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/ai-warevo/ci-cpp20

jobs:
  # ────────────────────────────────────────────────────────────
  # BUILD-TEST — Linux (container)
  # ────────────────────────────────────────────────────────────
  build-test:
    name: ${{ matrix.toolchain }} / ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    container:
      image: ${{ env.IMAGE }}
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: gcc15
            build_type: [Debug, Release]
          - toolchain: clang18-libstdcxx
            build_type: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup toolchain
        id: tc
        uses: ai-warevo/.github/ci/actions/setup-toolchain@main
        with:
          toolchain: ${{ matrix.toolchain }}
          container_mode: true

      - name: Configure & Build
        uses: ai-warevo/.github/ci/actions/cmake-build@main
        with:
          source_dir: .
          build_dir: build
          build_type: ${{ matrix.build_type }}
          extra_args: >-
            ${{ steps.tc.outputs.cmake_args }}
            -DAW_TPL_BUILD_EXAMPLES=ON
            -DAW_TPL_BUILD_TESTS=ON
            -DAW_TPL_WARNINGS_AS_ERRORS=ON
            -DCMAKE_INSTALL_PREFIX=install

      - name: Run Tests
        uses: ai-warevo/.github/ci/actions/ctest-run@main
        with:
          source_dir: .
          build_dir: build
          config: ${{ matrix.build_type }}
          output_on_failure: true
          timeout: 120

      - name: Run Examples (Unix)
        run: |
          for example in build/examples/aw_tpl_example_*; do
            echo "=== $(basename "$example")"
            "$example"
          done

      - name: Install
        uses: ai-warevo/.github/ci/actions/cmake-build@main
        with:
          install: 'true'

      - name: Package Artifacts
        run: tar -czvf aw_tpl-${{ matrix.toolchain }}-${{ matrix.build_type }}.tar.gz -C install .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aw_tpl-${{ matrix.toolchain }}-${{ matrix.build_type }}
          path: aw_tpl-*.tar.gz
          if-no-files-found: ignore

  # ────────────────────────────────────────────────────────────
  # BUILD-TEST — Windows (MSVC native runner)
  # ────────────────────────────────────────────────────────────
  build-test-windows:
    name: Windows MSVC / ${{ matrix.build_type }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure & Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DAW_TPL_BUILD_EXAMPLES=ON `
            -DAW_TPL_BUILD_TESTS=ON `
            -DAW_TPL_WARNINGS_AS_ERRORS=ON
          cmake --build build --parallel --config ${{ matrix.build_type }}

      - name: Run Tests
        run: ctest --test-dir build --config ${{ matrix.build_type }} --output-on-failure --timeout 120

      - name: Run Examples (Windows)
        shell: pwsh
        run: |
          $exes = Get-ChildItem -Path "build/examples" -Filter "aw_tpl_example_*.exe"
          foreach ($exe in $exes) {
            Write-Host "=== $($exe.Name)"
            & $exe.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  # ────────────────────────────────────────────────────────────
  # BUILD-TEST-DEFAULT — Linux (container, no examples/tests)
  # ────────────────────────────────────────────────────────────
  build-test-default:
    name: default options / ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    container:
      image: ${{ env.IMAGE }}
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        toolchain: [gcc15, clang18-libstdcxx]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup toolchain
        id: tc
        uses: ai-warevo/.github/ci/actions/setup-toolchain@main
        with:
          toolchain: ${{ matrix.toolchain }}
          container_mode: true

      - name: Configure & Build
        uses: ai-warevo/.github/ci/actions/cmake-build@main
        with:
          extra_args: >-
            ${{ steps.tc.outputs.cmake_args }}
            -DAW_TPL_WARNINGS_AS_ERRORS=ON

      - name: Run Tests
        uses: ai-warevo/.github/ci/actions/ctest-run@main
        with:
          output_on_failure: true
          timeout: 120

  # ────────────────────────────────────────────────────────────
  # BUILD-TEST-DEFAULT — Windows (MSVC native runner, no examples/tests)
  # ────────────────────────────────────────────────────────────
  build-test-default-windows:
    name: Windows default options / MSVC
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure & Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release `
            -DAW_TPL_WARNINGS_AS_ERRORS=ON
          cmake --build build --parallel

      - name: Run Tests
        run: ctest --test-dir build --output-on-failure --timeout 120
