# CI: build + test on every pull request. The heavier checks (sanitizers, lint, coverage) live in test.yml.
#
# Runners are pinned to ubuntu-24.04 on purpose: `ubuntu-latest` moves to 26.04 and would silently change compilers.

name: CI

on:
  pull_request:
    branches: [main, master]
  merge_group:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.toolchain }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: clang18-libcxx
            os: ubuntu-24.04
          - toolchain: gcc15
            os: ubuntu-24.04
          - toolchain: msvc
            os: windows-latest
        build_type: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        id: tc
        uses: ai-warevo/.github/ci/actions/setup-toolchain@main
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Configure & Build
        uses: ai-warevo/.github/ci/actions/cmake-build@main
        with:
          source_dir: .
          build_dir: build
          build_type: ${{ matrix.build_type }}
          extra_args: >-
            ${{ steps.tc.outputs.cmake_args }}
            -DAW_TPL_BUILD_EXAMPLES=ON
            -DAW_TPL_BUILD_TESTS=ON
            -DAW_TPL_WARNINGS_AS_ERRORS=ON
            -DCMAKE_INSTALL_PREFIX=install

      - name: Run Tests
        uses: ai-warevo/.github/ci/actions/ctest-run@main
        with:
          source_dir: .
          build_dir: build
          config: ${{ matrix.build_type }}
          output_on_failure: true
          timeout: 120

      - name: Run Examples (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter aw_tpl_example_*.exe | ForEach-Object {
            Write-Host "=== $($_.Name)"
            & $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Run Examples (Unix)
        if: runner.os != 'Windows'
        run: |
          for example in ./build/examples/aw_tpl_example_*; do
            echo "=== $example"
            "$example"
          done

      - name: Install
        run: cmake --install build

      - name: Package Artifacts (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path install\* -DestinationPath aw_tpl-${{ matrix.toolchain }}-${{ matrix.build_type }}.zip

      - name: Package Artifacts (Unix)
        if: runner.os != 'Windows'
        run: tar -czvf aw_tpl-${{ matrix.toolchain }}-${{ matrix.build_type }}.tar.gz -C install .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aw_tpl-${{ matrix.toolchain }}-${{ matrix.build_type }}
          path: aw_tpl-*.zip
          if-no-files-found: ignore
      - name: Upload Build Artifact (tar.gz)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: aw_tpl-${{ matrix.toolchain }}-${{ matrix.build_type }}
          path: aw_tpl-*.tar.gz

  # Default options (no examples/tests): this is what a consumer gets without enabling anything.
  build-test-default:
    name: default options / ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: clang18-libcxx
            os: ubuntu-24.04
          - toolchain: gcc15
            os: ubuntu-24.04
          - toolchain: msvc
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        id: tc
        uses: ai-warevo/.github/ci/actions/setup-toolchain@main
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Configure & Build
        uses: ai-warevo/.github/ci/actions/cmake-build@main
        with:
          source_dir: .
          build_dir: build
          build_type: Release
          extra_args: ${{ steps.tc.outputs.cmake_args }} -DAW_TPL_WARNINGS_AS_ERRORS=ON

      - name: Run Tests
        uses: ai-warevo/.github/ci/actions/ctest-run@main
        with:
          source_dir: .
          build_dir: build
          config: Release
          output_on_failure: true
          timeout: 120
