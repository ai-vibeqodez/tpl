# Test: everything that is too slow or too noisy for the per-PR build matrix in ci.yml.
#   lint        clang-format + clang-tidy (clang 18)
#   sanitizers  ASan+UBSan and TSan, full suite
#   stress      30x the concurrency tests in optimized builds (different timing, different races)
#   coverage    gcc --coverage -> gcovr; the badge/report are published only from main
#
# All jobs run inside ghcr.io/ai-warevo/ci-cpp20 (gcc-15, clang-18, cmake, ninja, gcovr).
# Coverage deploy actions still run on ubuntu-latest (they only push badges, no toolchain).

name: Test

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write # badge + gh-pages deploy (main only)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/ai-warevo/ci-cpp20

jobs:
  lint:
    name: Lint (clang-format, clang-tidy)
    runs-on: ubuntu-latest
    container:
      image: ${{ env.IMAGE }}
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify toolchain
        run: |
          clang++-18 --version | head -1
          clang-format --version | head -1
          clang-tidy --version | head -1

      - name: clang-format (.hpp)
        run: |
          find include src tests -name '*.hpp' 2>/dev/null | xargs clang-format --dry-run -Werror

      - name: clang-format (.cpp)
        run: |
          find include src tests -name '*.cpp' 2>/dev/null | xargs clang-format --dry-run -Werror

      - name: Configure & Build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++" \
            -DAW_TPL_BUILD_TESTS=ON

      - name: Run clang-tidy
        run: |
          find include src -name '*.hpp' -o -name '*.cpp' | \
            xargs clang-tidy -p build --checks='*'

  sanitizers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container:
      image: ${{ env.IMAGE }}
      options: --user root
    # The distro libc++/libc++abi are not ASan-instrumented: they allocate exception messages with the (intercepted)
    # operator new but release them with plain free(), which ASan reports as alloc-dealloc-mismatch on every
    # thrown std::runtime_error/logic_error. A toolchain false positive, not a tpl bug.
    env:
      ASAN_OPTIONS: alloc_dealloc_mismatch=0:detect_leaks=1
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan + UBSan (clang-18, libc++)
            toolchain: clang18-libcxx
            sanitizer: address
            stdlib: libc++
          # TSan uses libstdc++: libc++'s shared_ptr/atomic internals are not TSan-instrumented in the distro package,
          # which would report false races on the very reference counts this library relies on.
          - name: TSan (clang-18, libstdc++)
            toolchain: clang18-libstdcxx
            sanitizer: thread
            stdlib: libstdc++

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # TSan maps shadow memory at fixed addresses; recent kernels' ASLR range makes it abort at startup.
      - name: Relax ASLR for ThreadSanitizer
        if: matrix.sanitizer == 'thread'
        run: sysctl vm.mmap_rnd_bits=28

      # AW_TPL_SANITIZE adds PUBLIC compile/link flags to aw::tpl, so the tests are instrumented as well.
      - name: Configure & Build
        run: |
          if [ "${{ matrix.stdlib }}" = "libc++" ]; then
            cmake -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DCMAKE_CXX_COMPILER=clang++-18 \
              -DCMAKE_CXX_FLAGS="-stdlib=libc++ -fexperimental-library" \
              -DAW_TPL_BUILD_EXAMPLES=OFF \
              -DAW_TPL_BUILD_TESTS=ON \
              -DAW_TPL_SANITIZE=${{ matrix.sanitizer }}
          else
            cmake -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DCMAKE_CXX_COMPILER=clang++-18 \
              -DCMAKE_CXX_FLAGS="-stdlib=${{ matrix.stdlib }}" \
              -DAW_TPL_BUILD_EXAMPLES=OFF \
              -DAW_TPL_BUILD_TESTS=ON \
              -DAW_TPL_SANITIZE=${{ matrix.sanitizer }}
          fi
          cmake --build build --parallel

      - name: Run Tests
        working-directory: build
        run: ctest --output-on-failure --timeout 300

  stress:
    name: Repeat concurrency tests 30x (${{ matrix.toolchain }}, Release)
    runs-on: ubuntu-latest
    container:
      image: ${{ env.IMAGE }}
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        toolchain: [clang18-libcxx, gcc15]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure & Build
        run: |
          if [ "${{ matrix.toolchain }}" = "clang18-libcxx" ]; then
            cmake -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_CXX_COMPILER=clang++-18 \
              -DCMAKE_CXX_FLAGS="-stdlib=libc++ -fexperimental-library"
          else
            cmake -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release
          fi
          cmake --build build --parallel

      # `until-fail:30` = run up to 30 times and stop at the first failure.
      - name: Repeat the concurrency tests
        working-directory: build
        run: ctest -C Release -R tpl_concurrency --repeat until-fail:30 --output-on-failure --timeout 120

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    container:
      image: ${{ env.IMAGE }}
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The distro g++ (13): gcovr pins the `gcov` matching the default gcc, so build with that same compiler.
      # AW_TPL_ENABLE_COVERAGE adds PUBLIC --coverage flags to aw::tpl, which instruments the tests too.
      - name: Configure & Build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DAW_TPL_ENABLE_COVERAGE=ON
          cmake --build build --parallel

      - name: Run Tests
        working-directory: build
        run: ctest --output-on-failure --timeout 300

      - name: Generate Coverage Reports (XML & HTML)
        run: |
          gcovr --xml-output coverage.xml \
            --root . \
            --source-filter 'include/aw/tpl/|src/' \
            --exclude '_deps/*' \
            -r . \
            build
          gcovr --html --html-details -o coverage.html \
            --root . \
            --source-filter 'include/aw/tpl/|src/' \
            --exclude '_deps/*' \
            -r . \
            build
          mkdir -p htmlcov
          cp coverage.html htmlcov/

      - name: Parse Coverage Metrics
        id: coverage_parser
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          pct=$(gcovr --print-summary --root . --exclude '_deps/*' build 2>&1 | grep 'LINE:' | awk '{print $3}' | tr -d '%')
          echo "percent=${pct}" >> "$GITHUB_OUTPUT"
          if [ "${pct%.*}" -ge 80 ] 2>/dev/null; then
            color="brightgreen"
          elif [ "${pct%.*}" -ge 50 ] 2>/dev/null; then
            color="yellow"
          else
            color="red"
          fi
          echo "color=${color}" >> "$GITHUB_OUTPUT"

      - name: Generate Coverage Badge
        id: badge_generator
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: schneegans/dynamic-badges-action@v1
        with:
          gistid: ${{ secrets.BADGE_GIST_ID }}
          token: ${{ secrets.BADGE_GIST_TOKEN }}
          filename: tpl-coverage.json
          label: coverage
          message: ${{ steps.coverage_parser.outputs.percent }}%
          color: ${{ steps.coverage_parser.outputs.color }}

      - name: Deploy Coverage Report to gh-pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./htmlcov
          keep_files: true
