# Test: everything that is too slow or too noisy for the per-PR build matrix in ci.yml.
#   lint        clang-format + clang-tidy (clang 18)
#   sanitizers  ASan+UBSan and TSan, full suite
#   stress      30x the concurrency tests in optimized builds (different timing, different races)
#   coverage    gcc --coverage -> gcovr; the badge/report are published only from main

name: Test

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write # badge + gh-pages deploy (main only)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (clang-format, clang-tidy)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain + tools
        id: tc
        uses: ai-warevo/.github/ci/actions/setup-toolchain@main
        with:
          toolchain: clang18-libcxx
          tools: 'true'

      # The action ANDs its -name filters, so `extensions: cpp,hpp` would match no file at all: one step per extension.
      - name: clang-format (.hpp)
        uses: ai-warevo/.github/ci/actions/clang-format@main
        with:
          source_dir: .
          extensions: hpp
      - name: clang-format (.cpp)
        uses: ai-warevo/.github/ci/actions/clang-format@main
        with:
          source_dir: .
          extensions: cpp

      # Configure + build: clang-tidy needs compile_commands.json and the fetched dependencies.
      - name: Configure & Build
        uses: ai-warevo/.github/ci/actions/cmake-build@main
        with:
          source_dir: .
          build_dir: build
          build_type: Debug
          extra_args: >-
            ${{ steps.tc.outputs.cmake_args }}
            -DAW_TPL_BUILD_TESTS=ON

      - name: Run clang-tidy
        uses: ai-warevo/.github/ci/actions/clang-tidy@main
        with:
          source_dir: .
          build_dir: build

  sanitizers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    # The distro libc++/libc++abi are not ASan-instrumented: they allocate exception messages with the (intercepted)
    # operator new but release them with plain free(), which ASan reports as alloc-dealloc-mismatch on every
    # thrown std::runtime_error/logic_error. A toolchain false positive, not a tpl bug.
    env:
      ASAN_OPTIONS: alloc_dealloc_mismatch=0:detect_leaks=1
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan + UBSan (clang-18, libc++)
            toolchain: clang18-libcxx
            sanitizer: address
          # TSan uses libstdc++: libc++'s shared_ptr/atomic internals are not TSan-instrumented in the distro package,
          # which would report false races on the very reference counts this library relies on.
          - name: TSan (clang-18, libstdc++)
            toolchain: clang18-libstdcxx
            sanitizer: thread

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        id: tc
        uses: ai-warevo/.github/ci/actions/setup-toolchain@main
        with:
          toolchain: ${{ matrix.toolchain }}
          sanitizer_runtime: 'true'

      # TSan maps shadow memory at fixed addresses; recent kernels' ASLR range makes it abort at startup.
      - name: Relax ASLR for ThreadSanitizer
        if: matrix.sanitizer == 'thread'
        run: sudo sysctl vm.mmap_rnd_bits=28

      # AW_TPL_SANITIZE adds PUBLIC compile/link flags to aw::tpl, so the tests are instrumented as well.
      - name: Configure & Build
        uses: ai-warevo/.github/ci/actions/cmake-build@main
        with:
          source_dir: .
          build_dir: build
          build_type: RelWithDebInfo
          extra_args: >-
            ${{ steps.tc.outputs.cmake_args }}
            -DAW_TPL_BUILD_EXAMPLES=OFF
            -DAW_TPL_BUILD_EXAMPLES=OFF
            -DAW_TPL_BUILD_TESTS=ON
            -DAW_TPL_SANITIZE=${{ matrix.sanitizer }}

      - name: Run Tests
        uses: ai-warevo/.github/ci/actions/ctest-run@main
        with:
          source_dir: .
          build_dir: build
          config: RelWithDebInfo
          output_on_failure: true
          timeout: 300

  stress:
    name: Repeat concurrency tests 30x (${{ matrix.toolchain }}, Release)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain: [clang18-libcxx, gcc15]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        id: tc
        uses: ai-warevo/.github/ci/actions/setup-toolchain@main
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Configure & Build
        uses: ai-warevo/.github/ci/actions/cmake-build@main
        with:
          source_dir: .
          build_dir: build
          build_type: Release
          extra_args: ${{ steps.tc.outputs.cmake_args }}

      # `until-fail:30` = run up to 30 times and stop at the first failure.
      - name: Repeat the concurrency tests
        working-directory: build
        run: ctest -C Release -R tpl_concurrency --repeat until-fail:30 --output-on-failure --timeout 120

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The distro g++ (13): gcovr pins the `gcov` matching the default gcc, so build with that same compiler.
      # AW_TPL_ENABLE_COVERAGE adds PUBLIC --coverage flags to aw::tpl, which instruments the tests too.
      - name: Configure & Build
        uses: ai-warevo/.github/ci/actions/cmake-build@main
        with:
          source_dir: .
          build_dir: build
          build_type: Debug
          extra_args: -DAW_TPL_ENABLE_COVERAGE=ON

      - name: Run Tests
        uses: ai-warevo/.github/ci/actions/ctest-run@main
        with:
          source_dir: .
          build_dir: build
          config: Debug
          output_on_failure: true
          timeout: 300

      - name: Generate Coverage Reports (XML & HTML)
        uses: ai-warevo/.github/ci/actions/gcovr-report@main
        with:
          source_dir: .
          build_dir: build
          source_filter: "include/aw/tpl/ src/"
          exclude: _deps/*
          output_dir: htmlcov
          xml_path: coverage.xml

      - name: Parse Coverage Metrics
        id: coverage_parser
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: ai-warevo/.github/ci/actions/coverage-parser@main
        with:
          xml_path: coverage.xml

      - name: Generate Coverage Badge
        id: badge_generator
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: ai-warevo/.github/ci/actions/badge@main
        with:
          width: '99'
          height: '20'
          text_left: 'coverage'
          text_right: '${{ steps.coverage_parser.outputs.percent }}'
          bg_color_right: '${{ steps.coverage_parser.outputs.color }}'
          filename: 'coverage.svg'

      - name: Deploy Badge
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: ai-warevo/.github/ci/actions/badge-deploy@main
        with:
          badge_path: coverage.svg

      - name: Deploy Coverage Report to gh-pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: ai-warevo/.github/ci/actions/coverage-html-deploy@main
        with:
          folder: htmlcov