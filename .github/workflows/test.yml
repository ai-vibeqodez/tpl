name: Tests & Coverage

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

# Отменяем старые незавершённые запуски для того же PR / ветки
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check clang-format
        uses: ai-warevo/.github/ci/actions/clang-format@main
        with:
          source_dir: .
          extensions: cpp,hpp

      - name: Configure & Build Tests with Coverage
        uses: ai-warevo/.github/ci/actions/cmake-build@main
        with:
          source_dir: .
          build_dir: build
          build_type: Debug
          extra_args: -DAW_TPL_BUILD_EXAMPLES=OFF -DAW_TPL_BUILD_TESTS=ON -DAW_TPL_ENABLE_COVERAGE=ON

      - name: Run clang-tidy
        uses: ai-warevo/.github/ci/actions/clang-tidy@main
        with:
          source_dir: .
          build_dir: build

      - name: Run CTest
        uses: ai-warevo/.github/ci/actions/ctest-run@main
        with:
          source_dir: .
          build_dir: build
          config: Debug
          output_on_failure: true

      - name: Generate Coverage Reports (XML & HTML)
        uses: ai-warevo/.github/ci/actions/gcovr-report@main
        with:
          source_dir: .
          build_dir: build
          source_filter: "include/aw/tpl/ src/"
          exclude: _deps/*
          output_dir: htmlcov
          xml_path: coverage.xml

      - name: Parse Coverage Metrics
        id: coverage_parser
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: ai-warevo/.github/ci/actions/coverage-parser@main
        with:
          xml_path: coverage.xml

      - name: Generate Coverage Badge
        id: badge_generator
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: ai-warevo/.github/ci/actions/badge@main
        with:
          width: '99'
          height: '20'
          text_left: 'coverage'
          text_right: '${{ steps.coverage_parser.outputs.percent }}'
          bg_color_right: '${{ steps.coverage_parser.outputs.color }}'
          filename: 'coverage.svg'

      - name: Deploy Badge
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: ai-warevo/.github/ci/actions/badge-deploy@main
        with:
          badge_path: coverage.svg

      - name: Deploy Coverage Report to gh-pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: ai-warevo/.github/ci/actions/coverage-html-deploy@main
        with:
          folder: htmlcov

  sanitizers:
    name: Sanitizers (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        sanitizer: [ address, thread ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Relax ASLR for ThreadSanitizer
        if: matrix.sanitizer == 'thread'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure & Build
        uses: ai-warevo/.github/ci/actions/cmake-build@main
        with:
          source_dir: .
          build_dir: build
          build_type: RelWithDebInfo
          extra_args: "-DAW_TPL_BUILD_EXAMPLES=OFF -DAW_TPL_BUILD_TESTS=ON -DAW_TPL_SANITIZE=${{ matrix.sanitizer }}"

      - name: Run CTest
        uses: ai-warevo/.github/ci/actions/ctest-run@main
        with:
          source_dir: .
          build_dir: build
          output_on_failure: true
          timeout: 120
