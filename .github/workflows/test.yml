# Test: everything that is too slow or too noisy for the per-PR build matrix in ci.yml.
#   lint        clang-format + clang-tidy (clang 18)
#   sanitizers  ASan+UBSan and TSan, full suite
#   stress      30x the concurrency tests in optimized builds (different timing, different races)
#   coverage    gcc --coverage -> gcovr; the badge/report are published only from main
#
# Linux jobs run inside ghcr.io/ai-warevo/ci-cpp23 (gcc-15, clang-18, cmake, ninja, gcovr).
# MSVC jobs run on windows-latest (native runner).
# Coverage deploy actions run on ubuntu-latest (they only push badges/HTML, no toolchain).

name: Test

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write # badge + gh-pages deploy (main only)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/ai-warevo/ci-cpp23

jobs:
  # ────────────────────────────────────────────────────────────
  # LINT — Linux (clang-format, clang-tidy, container)
  # ────────────────────────────────────────────────────────────
  lint:
    name: Lint (clang-format, clang-tidy)
    runs-on: ubuntu-latest
    container:
      image: ${{ env.IMAGE }}
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify toolchain
        run: |
          clang++-18 --version | head -1
          clang-format --version | head -1
          clang-tidy --version | head -1

      - name: clang-format (.hpp)
        uses: ai-warevo/.github/ci/actions/clang-format@main
        with:
          source_dir: .
          extensions: hpp
          config_file: .clang-format
          exclude: _deps/*,build/*,CMakeFiles/*,cmake/*

      - name: clang-format (.cpp)
        uses: ai-warevo/.github/ci/actions/clang-format@main
        with:
          source_dir: .
          extensions: cpp
          config_file: .clang-format
          exclude: _deps/*,build/*,CMakeFiles/*,cmake/*

      - name: Setup toolchain
        id: tc
        uses: ai-warevo/.github/ci/actions/setup-toolchain@main
        with:
          toolchain: clang18-libcxx
          container_mode: true

      - name: Configure & Build
        uses: ai-warevo/.github/ci/actions/cmake-build@main
        with:
          source_dir: .
          build_dir: build
          build_type: Debug
          extra_args: >-
            ${{ steps.tc.outputs.cmake_args }}
            -DAW_TPL_BUILD_TESTS=ON

      - name: Run clang-tidy
        uses: ai-warevo/.github/ci/actions/clang-tidy@main
        with:
          source_dir: .
          build_dir: build
          checks: '*'
          header_filter: '.*'
          exclude: _deps/*,build/*,CMakeFiles/*,cmake/*

  # ────────────────────────────────────────────────────────────
  # SANITIZERS — Linux (ASan+UBSan + TSan, container)
  # ────────────────────────────────────────────────────────────
  sanitizers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container:
      image: ${{ env.IMAGE }}
      options: --user root
    env:
      ASAN_OPTIONS: alloc_dealloc_mismatch=0:detect_leaks=1
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan + UBSan (clang-18, libc++)
            toolchain: clang18-libcxx
            sanitizer: address
            stdlib: libc++
          - name: TSan (clang-18, libstdc++)
            toolchain: clang18-libstdcxx
            sanitizer: thread
            stdlib: libstdc++

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Relax ASLR for ThreadSanitizer
        if: matrix.sanitizer == 'thread'
        run: sysctl vm.mmap_rnd_bits=28

      - name: Setup toolchain
        id: tc
        uses: ai-warevo/.github/ci/actions/setup-toolchain@main
        with:
          toolchain: ${{ matrix.toolchain }}
          sanitizer: ${{ matrix.sanitizer }}
          container_mode: true

      - name: Configure & Build
        uses: ai-warevo/.github/ci/actions/cmake-build@main
        with:
          source_dir: .
          build_dir: build
          build_type: RelWithDebInfo
          extra_args: >-
            ${{ steps.tc.outputs.cmake_args }}
            -DAW_TPL_BUILD_EXAMPLES=OFF
            -DAW_TPL_BUILD_TESTS=ON
            -DAW_TPL_SANITIZE=${{ matrix.sanitizer }}

      - name: Run Tests
        uses: ai-warevo/.github/ci/actions/ctest-run@main
        with:
          source_dir: .
          build_dir: build
          output_on_failure: true
          timeout: 300

  # ────────────────────────────────────────────────────────────
  # STRESS — Linux (30x concurrency tests, container)
  # ────────────────────────────────────────────────────────────
  stress:
    name: Repeat concurrency tests 30x (${{ matrix.toolchain }}, Release)
    runs-on: ubuntu-latest
    container:
      image: ${{ env.IMAGE }}
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        toolchain: [clang18-libcxx, gcc15]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup toolchain
        id: tc
        uses: ai-warevo/.github/ci/actions/setup-toolchain@main
        with:
          toolchain: ${{ matrix.toolchain }}
          container_mode: true

      - name: Configure & Build
        uses: ai-warevo/.github/ci/actions/cmake-build@main
        with:
          source_dir: .
          build_dir: build
          build_type: Release
          extra_args: ${{ steps.tc.outputs.cmake_args }}

      - name: Repeat the concurrency tests
        uses: ai-warevo/.github/ci/actions/ctest-run@main
        with:
          source_dir: .
          build_dir: build
          config: Release
          output_on_failure: true
          timeout: 120

  # ────────────────────────────────────────────────────────────
  # COVERAGE — Linux (gcc --coverage, container)
  # ────────────────────────────────────────────────────────────
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    container:
      image: ${{ env.IMAGE }}
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup toolchain
        id: tc
        uses: ai-warevo/.github/ci/actions/setup-toolchain@main
        with:
          toolchain: gcc15
          container_mode: true

      - name: Configure & Build
        uses: ai-warevo/.github/ci/actions/cmake-build@main
        with:
          source_dir: .
          build_dir: build
          build_type: Debug
          extra_args: >-
            ${{ steps.tc.outputs.cmake_args }}
            -DAW_TPL_ENABLE_COVERAGE=ON

      - name: Run Tests
        uses: ai-warevo/.github/ci/actions/ctest-run@main
        with:
          source_dir: .
          build_dir: build
          output_on_failure: true
          timeout: 300

      - name: Generate Coverage Reports (XML & HTML)
        id: gcovr
        uses: ai-warevo/.github/ci/actions/gcovr-report@main
        with:
          source_dir: .
          build_dir: build
          source_filter: include/aw/tpl/ src/
          exclude: _deps/*
          output_dir: htmlcov
          xml_path: coverage.xml

      - name: Parse Coverage Percentage
        id: coverage
        uses: ai-warevo/.github/ci/actions/coverage-parser@main
        with:
          xml_path: coverage.xml

      - name: Generate Coverage Badge
        uses: ai-warevo/.github/ci/actions/badge@main
        with:
          text_left: coverage
          text_right: '${{ steps.coverage.outputs.percent }}%'
          bg_color_left: '#555'
          bg_color_right: '${{ steps.coverage.outputs.color }}'
          filename: coverage.svg

      - name: Deploy Coverage Badge
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: ai-warevo/.github/ci/actions/badge-deploy@main
        with:
          badge_path: coverage.svg
          branch: badges
          target_folder: .

      - name: Deploy Coverage HTML to gh-pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: ai-warevo/.github/ci/actions/coverage-html-deploy@main
        with:
          folder: htmlcov
          branch: gh-pages
          target_folder: .

  # ────────────────────────────────────────────────────────────
  # MSVC TEST — Windows (Debug + Release, native runner)
  # ────────────────────────────────────────────────────────────
  test-windows:
    name: Test Windows (MSVC)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure & Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DAW_TPL_BUILD_TESTS=ON `
            -DAW_TPL_WARNINGS_AS_ERRORS=ON
          cmake --build build --parallel --config ${{ matrix.build_type }}

      - name: Run Tests
        run: ctest --test-dir build --config ${{ matrix.build_type }} --output-on-failure --timeout 120
