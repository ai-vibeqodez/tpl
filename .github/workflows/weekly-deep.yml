# Weekly Deep — sanitizers + coverage + stress tests
#
# Reusable workflow consumer that delegates to reusable-weekly-deep.yml
# with aw::tpl-specific parameters.

name: Weekly Deep

on:
  schedule:
    - cron: '0 0 * * 1'  # every Monday at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  weekly-deep:
    uses: ai-warevo/.github/.github/workflows/reusable-weekly-deep.yml@main
    with:
      source_dir: .
      build_dir: build
      container_image: ghcr.io/ai-warevo/ci-cpp23
      source_filter: include/ src/
      exclude: _deps/*
    permissions:
      contents: write
      packages: write
